services:
  postgres:
    image: postgres:16-alpine
    container_name: sql-toolset-pg-example
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data_example:/var/lib/postgresql/data

volumes:
  pg_data_example:
